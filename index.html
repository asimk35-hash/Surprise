*{box-sizing:border-box}
body{

  background: radial-gradient(circle at top, #1f3b73 0%, #0b1028 45%, #040612 100%);
}
.stars, .hearts{position:fixed; inset:0; pointer-events:none; z-index:0}
.star{
  position:absolute; width:3px; height:3px; border-radius:50%; background:white;
  animation:twinkle 2s infinite alternate;
}

.heart{

  animation:floatUp 8s linear infinite;
}

  0%{transform:translateY(0) rotate(0deg); opacity:0}
  20%{opacity:.7}
  100%{transform:translateY(-110vh) rotate(360deg); opacity:0}
}
.wrap{

  padding:18px;
}

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  const master = audioCtx.createGain();
  master.gain.value = 0.055;
  master.connect(audioCtx.destination);

  const delay = audioCtx.createDelay();
  delay.delayTime.value = 0.42;

  const feedback = audioCtx.createGain();
  feedback.gain.value = 0.26;

  delay.connect(feedback);
  feedback.connect(delay);
  delay.connect(master);

  const notes = [392, 440, 493.88, 587.33, 523.25, 493.88, 440, 392];
  let n = 0;

  function playNote(){
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();

    osc.type = "sine";
    osc.frequency.setValueAtTime(notes[n % notes.length], now);

    filter.type = "lowpass";
    filter.frequency.value = 1150;

    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.18, now + 0.25);
    gain.gain.linearRampToValueAtTime(0.08, now + 1.4);
    gain.gain.linearRampToValueAtTime(0, now + 2.2);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(master);
    gain.connect(delay);

    osc.start(now);
    osc.stop(now + 2.4);

    n++;
    setTimeout(playNote, 1900);
  }

  playNote();
}

function setupProgress(){
  const p = document.getElementById("progress");
  slides.forEach(() => {
    const bar = document.createElement("div");
    bar.className = "bar";
    bar.innerHTML = "<span></span>";
    p.appendChild(bar);
  });
}
function updateProgress(){
  document.querySelectorAll(".bar span").forEach((b,i)=> b.style.width = i <= current ? "100%" : "0%");
}
function typeWriter(text){
  clearInterval(typingTimer);
  const el = document.getElementById("text");
  el.textContent = "";
  let i = 0;
  typingTimer = setInterval(() => {
    el.textContent += text.charAt(i);
    i++;
    if(i >= text.length) clearInterval(typingTimer);
  }, 28);
}
function next(){
  startFluteMusic();
  current++;
  if(current >= slides.length){
    document.getElementById("btn").textContent = "💙 Message Complete";
    return;
  }
  updateProgress();
  typeWriter(slides[current]);
  const btns = ["💫 Wait... aur bhi hai", "🦋 Swipe the feels", "🌙 Dil ki next slide", "💙 Stitch says continue", "💌 Last note unlock karo"];
  document.getElementById("btn").textContent = btns[current-1] || "✨ Continue";
}
function makeStars(){
  const box=document.getElementById("stars");
  for(let i=0;i<70;i++){
    const s=document.createElement("span");
    s.className="star";
    s.style.left=Math.random()*100+"%";
    s.style.top=Math.random()*100+"%";
    s.style.animationDelay=Math.random()*3+"s";
    box.appendChild(s);
  }
}
function makeHearts(){
  const box=document.getElementById("hearts");
  for(let i=0;i<18;i++){
    const h=document.createElement("span");
    h.className="heart";
    h.textContent = ["💙","✨","🦋","🌙"][Math.floor(Math.random()*4)];
    h.style.left=Math.random()*100+"%";
    h.style.animationDelay=Math.random()*8+"s";
    h.style.animationDuration=(6+Math.random()*5)+"s";
    box.appendChild(h);
  }
}
setupProgress(); makeStars(); makeHearts(); updateProgress(); typeWriter(slides[0]);
</script>
